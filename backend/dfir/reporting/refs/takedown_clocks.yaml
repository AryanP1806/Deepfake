# Deadlines that apply AFTER a user reports something. Compiled from published summaries of the 2026 amendment
# to India's IT Rules (G.S.R. 120(E), notified 10 Feb 2026, in force 20 Feb 2026). This is guidance, not legal
# advice: confirm against the gazette text or with a lawyer before relying on a deadline in a dispute.
as_of: "2026-10"
verify_note: "Confirm the current rule text. Some summaries disagree on dates; a later draft amendment (30 Mar 2026) may also apply."
sources:
  - {name: "MediaNama summary", url: "https://www.medianama.com/2026/02/223-meity-amendments-it-rules-synthetic-media-deepfakes/"}
  - {name: "Khaitan & Co", url: "https://www.khaitanco.com/thought-leadership/MeitY-notifies-the-IT-Amendment-Rules-2026"}
  - {name: "MeitY", url: "https://www.meity.gov.in/"}
  - {name: "Grievance Appellate Committee", url: "https://gac.gov.in"}
clocks:
  intimate_morphed:
    hours: 2
    label: "Intimate, morphed or impersonating content - complaint by the person shown"
    basis: "IT Rules 2021 Rule 3(2)(b), as amended in 2026 (previously 24 hours)"
  other_content:
    hours: 36
    label: "Other prohibited content reported through the platform's grievance process"
    basis: "First proviso to Rule 3(2)(a)(i), as amended in 2026 (previously 72 hours) - check applicability"
  grievance_resolution:
    days: 7
    label: "Grievance Officer must resolve a complaint"
    basis: "Rule 3(2)(a)(i), as amended in 2026 (previously 15 days)"
  gac_appeal:
    days: 30
    label: "Appeal to the Grievance Appellate Committee, within 30 days of the Grievance Officer's decision"
    basis: "IT Rules 2021 Rule 3A (2022 amendment) - check current limit"
  authority_order:
    hours: 3
    label: "Court order or government notice - applies to platforms; a private person cannot trigger it"
    basis: "Rule 3(1)(d), as amended in 2026"
suggested_followups:
  ncrp_check_days: 7      # not a legal deadline: when it is sensible to check the complaint status
  police_check_days: 7
